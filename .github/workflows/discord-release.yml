name: Send Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to announce or test (e.g. v0.3.7)"
        required: true
      test:
        description: "Prefix the message with [TEST] (uncheck to send a real announcement)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Resolve release data
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_IS_TEST: ${{ github.event.inputs.test }}
          EVT_RELEASE_NAME: ${{ github.event.release.name }}
          EVT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVT_RELEASE_BODY: ${{ github.event.release.body }}
          EVT_RELEASE_URL: ${{ github.event.release.html_url }}
          EVT_AUTHOR_LOGIN: ${{ github.event.release.author.login }}
          EVT_AUTHOR_AVATAR: ${{ github.event.release.author.avatar_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$DISPATCH_TAG"
            RAW_NAME="$(gh release view "$DISPATCH_TAG" --repo "$REPO" --json name --jq '.name // .tagName')"
            if [ "$DISPATCH_IS_TEST" = "true" ]; then
              RELEASE_NAME="[TEST] $RAW_NAME"
            else
              RELEASE_NAME="$RAW_NAME"
            fi
            RELEASE_BODY=$(gh release view "$DISPATCH_TAG" --repo "$REPO" --json body --jq '.body')
            RELEASE_URL=$(gh release view "$DISPATCH_TAG" --repo "$REPO" --json url --jq '.url')
            AUTHOR_LOGIN=$(gh release view "$DISPATCH_TAG" --repo "$REPO" --json author --jq '.author.login')
            AUTHOR_AVATAR="https://github.com/${AUTHOR_LOGIN}.png"
          else
            RELEASE_NAME="$EVT_RELEASE_NAME"
            RELEASE_TAG="$EVT_RELEASE_TAG"
            RELEASE_BODY="$EVT_RELEASE_BODY"
            RELEASE_URL="$EVT_RELEASE_URL"
            AUTHOR_LOGIN="$EVT_AUTHOR_LOGIN"
            AUTHOR_AVATAR="$EVT_AUTHOR_AVATAR"
          fi

          EOF_MARKER="GHA_EOF_${RANDOM}${RANDOM}"
          {
            echo "RELEASE_NAME=$RELEASE_NAME"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_URL=$RELEASE_URL"
            echo "AUTHOR_LOGIN=$AUTHOR_LOGIN"
            echo "AUTHOR_AVATAR=$AUTHOR_AVATAR"
            echo "RELEASE_BODY<<$EOF_MARKER"
            echo "$RELEASE_BODY"
            echo "$EOF_MARKER"
          } >> "$GITHUB_ENV"

      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          BODY_TRUNCATED=$(printf '%s' "$RELEASE_BODY" | head -c 4000)
          PAYLOAD=$(jq -n \
            --arg title "🚀 New Release: ${RELEASE_NAME:-$RELEASE_TAG}" \
            --arg desc "**Version:** \`$RELEASE_TAG\`

          **What's Changed:**
          $BODY_TRUNCATED" \
            --arg url "$RELEASE_URL" \
            --arg footer "$REPO • Published by @$AUTHOR_LOGIN" \
            --arg icon "$AUTHOR_AVATAR" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 5814783, footer: {text: $footer, icon_url: $icon}}]}')

          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
